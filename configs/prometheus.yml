global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: 'node_exporter_app1'
    static_configs:
      - targets: ['10.0.1.99:9100']

  - job_name: 'node_exporter_app2'
    static_configs:
      - targets: ['10.0.2.247:9100']
